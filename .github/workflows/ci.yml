name: CLI CI/CD
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cli-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
jobs:
  verify:
    name: Verify CLI
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install audio tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      # Module type declarations are produced by the shared schema build.
      - run: npm run build
      - run: npm run typecheck:modules
      - run: npm run lint
      - run: npm run test:modules
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-${{ github.run_id }}
          path: test-results/
          retention-days: 7
  package:
    name: Package CLI source
    needs: verify
    if: >-
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      prerelease: ${{ steps.archive.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Archive the verified commit
        id: archive
        env:
          RELEASE_REF: ${{ github.ref }}
          RELEASE_SHA: ${{ github.sha }}
        run: bash scripts/package-release.sh
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Verify installation from release archive
        run: |
          mkdir -p work/release-install
          tar -xzf outputs/release/*.tar.gz -C work/release-install --strip-components=1
          cd work/release-install
          npm ci
          npx playwright install --with-deps chromium
          # Exercise the downloaded CLI with no build, API keys or audio tools.
          npx playwright test tests/browser/demo.spec.ts
      - uses: actions/upload-artifact@v4
        with:
          name: cli-source-${{ github.sha }}
          path: outputs/release/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: release-install-failure-${{ github.run_id }}
          path: work/release-install/test-results/
          retention-days: 7
  release:
    name: Publish GitHub Release
    needs: package
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cli-source-${{ github.sha }}
          path: release-assets
      - name: Publish immutable version
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_SHA: ${{ github.sha }}
          PRERELEASE: ${{ needs.package.outputs.prerelease }}
        run: |
          args=(--verify-tag --target "$RELEASE_SHA" --title "learnAnything $RELEASE_TAG" --generate-notes --notes-file release-assets/RELEASE-NOTES.md)
          if [[ "$PRERELEASE" == true ]]; then
            args+=(--prerelease --latest=false)
          fi
          # Existing releases are never overwritten; a new version needs a new tag.
          gh release create "$RELEASE_TAG" release-assets/*.tar.gz release-assets/SHA256SUMS "${args[@]}"
